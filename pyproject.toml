[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aquarov-research"
version = "0.1.0"
description = "Hardware-agnostic AI research platform for underwater ROV systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aquarov = ["py.typed"]
